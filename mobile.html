<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Add card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="mobile.css?v=1" />
</head>
<body class="mobile">
  <div class="screen">
    <!-- Dimmed checkout page behind the sheet -->
    <div class="appbar">
      <button class="appbar__back" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#2b2b5e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="appbar__title">Add card</span>
      <span class="appbar__secure">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="#5f5f5f" stroke-width="1.8"/><path d="M8 11V8a4 4 0 018 0v3" stroke="#5f5f5f" stroke-width="1.8"/></svg>
        Secure
      </span>
    </div>
    <div class="dim"></div>

    <!-- Bottom sheet -->
    <section class="sheet" id="sheet">
      <!-- SEARCH MODE -->
      <div class="sheet__mode" id="searchMode">
        <div class="sheet__head">
          <span class="sheet__label">Address line 1 <span class="req">*</span></span>
          <button class="sheet__close" id="closeSheet" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#3d3d3d" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="msearch" id="msearch">
          <span class="msearch__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <input class="msearch__input" id="addr" type="text" autocomplete="off" placeholder="Search address" />
        </div>

        <ul class="msuggest" id="suggest"></ul>

        <!-- Persistent escape hatch, pinned above the keyboard -->
        <button type="button" class="manual-row" id="manualRow">
          <span class="manual-row__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 20h16M4 20v-4l10-10 4 4L8 20H4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span>Can't find your address? <b>Enter it manually</b></span>
        </button>
      </div>

      <!-- MANUAL MODE -->
      <div class="sheet__mode" id="manualMode" hidden>
        <div class="sheet__head">
          <button class="mform__back" id="backToSearch" aria-label="Back to search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#3d3d3d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="sheet__label sheet__label--center">Enter address manually</span>
          <button class="sheet__close" id="closeSheet2" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#3d3d3d" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="mform">
          <div class="mfield">
            <label class="mfield__label" for="mLine1">Address line 1 <span class="req">*</span></label>
            <input class="mfield__input" id="mLine1" type="text" />
          </div>
          <div class="mfield">
            <label class="mfield__label" for="mLine2">Address line 2</label>
            <input class="mfield__input" id="mLine2" type="text" />
          </div>
          <div class="mfield">
            <label class="mfield__label" for="mPostcode">Postcode <span class="req">*</span></label>
            <input class="mfield__input" id="mPostcode" type="text" />
          </div>
          <div class="mfield">
            <label class="mfield__label" for="mCity">City <span class="req">*</span></label>
            <input class="mfield__input" id="mCity" type="text" />
          </div>
          <div class="mfield">
            <label class="mfield__label" for="mCounty">District or county</label>
            <input class="mfield__input" id="mCounty" type="text" />
          </div>
        </div>

        <button type="button" class="mform__save" id="saveManual">Save address</button>
      </div>
    </section>

    <!-- iOS-style keyboard (decorative + tap to type) -->
    <div class="keyboard" id="keyboard">
      <div class="kb-row" data-keys="q w e r t y u i o p"></div>
      <div class="kb-row kb-row--indent" data-keys="a s d f g h j k l"></div>
      <div class="kb-row">
        <button class="key key--fn key--shift" data-action="shift" aria-label="Shift">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4l7 7h-4v7H9v-7H5l7-7z" fill="#3d3d3d"/></svg>
        </button>
        <span class="kb-letters" data-keys="z x c v b n m"></span>
        <button class="key key--fn key--back" data-action="back" aria-label="Backspace">
          <svg width="22" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 5h11a1 1 0 011 1v12a1 1 0 01-1 1H9L2 12l7-7z" stroke="#3d3d3d" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9l5 6M17 9l-5 6" stroke="#3d3d3d" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="kb-row kb-row--bottom">
        <button class="key key--num" data-action="num">123</button>
        <button class="key key--space" data-action="space">space</button>
        <button class="key key--search" data-action="search">Search</button>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>

  <script src="mobile.js?v=1"></script>
</body>
</html>
